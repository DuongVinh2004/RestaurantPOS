# Local development Redis config for RestaurantPOS.
#
# Do not run the Chocolatey redis.conf from ProgramData for this project. That
# install directory is read-only for normal users, so Redis RDB saves can fail
# and trigger MISCONF / stop-writes-on-bgsave-error after the server has been
# running for a short time.

bind 127.0.0.1 ::1
protected-mode yes
port 6379
timeout 0
tcp-keepalive 300

daemonize no
supervised no
loglevel notice
logfile ""

databases 16
always-show-logo no

save 3600 1 300 100 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir ./storage/redis

appendonly no
