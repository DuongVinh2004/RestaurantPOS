version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: restaurantpos-app:latest
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  queue-worker:
    image: restaurantpos-app:latest
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    depends_on:
      - mysql
      - redis
    volumes:
      - ./storage:/var/www/html/storage
    env_file:
      - .env

  cron:
    image: restaurantpos-app:latest
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    depends_on:
      - mysql
      - redis
    env_file:
      - .env

  customer-web:
    build:
      context: ./customer-web
      dockerfile: Dockerfile.prod
    image: restaurantpos-customer-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./customer-web/.env.production

  staff-web-data:
    build:
      context: ./staff-web
      dockerfile: Dockerfile.prod
    image: restaurantpos-staff-web:latest
    volumes:
      - staff-web-dist:/app/dist

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - staff-web-dist:/var/www/staff-web
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certs:/etc/nginx/certs
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
      - staff-web-data
      - customer-web

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306" # Do not expose publicly

  redis:
    image: redis:alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379" # Do not expose publicly

volumes:
  mysql-data:
  redis-data:
  staff-web-dist:
