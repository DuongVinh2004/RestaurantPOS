name: booking-backend-ci

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

concurrency:
  group: booking-backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_ENV: testing
  APP_DEBUG: true
  APP_NAME: RestaurantPOS
  APP_KEY: base64:TGSYwo/ySw5TozAQw5bBUJCv4L3WNC7KSokVxs+fBDQ=
  APP_URL: http://127.0.0.1
  LOG_CHANNEL: stack
  LOG_LEVEL: debug
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_DATABASE: restaurantpos_ci
  DB_USERNAME: restaurantpos
  DB_PASSWORD: restaurantpos
  REQUIRE_REDIS_FOR_BOOKING_API: true
  CACHE_STORE: redis
  QUEUE_CONNECTION: database
  SESSION_DRIVER: database
  MAIL_MAILER: log
  CUSTOMER_AUTH_JWT_SECRET: booking-ci-customer-auth-secret-2026
  REDIS_CLIENT: phpredis
  REDIS_HOST: 127.0.0.1
  REDIS_PORT: 6379
  REDIS_DB: 0
  REDIS_CACHE_DB: 1
  BOOKING_CI_BOOTSTRAP_DATABASE: true
  BOOKING_CI_BOOTSTRAP_SITE: true
  BOOKING_CI_BOOTSTRAP_REPORTING: true
  BOOTSTRAP_ADMIN_USERNAME: admin_cuahang
  BOOTSTRAP_STAFF_USERNAME: staff_cuahang

jobs:
  booking-ci:
    name: ${{ matrix.lane.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane:
          - id: config-contracts
            name: fast-config-contracts
            command: bash scripts/ci/booking-config-contracts.sh
          - id: booking-smoke
            name: booking-smoke
            command: bash scripts/ci/booking-smoke-gate.sh
            timeout_seconds: 2400
          - id: runtime-smoke
            name: runtime-smoke
            command: bash scripts/ci/booking-runtime-smoke.sh
            timeout_seconds: 1800
          - id: phpstan
            name: phpstan
            command: bash scripts/ci/booking-phpstan.sh
            timeout_seconds: 2700
          - id: critical-security
            name: critical-security
            command: composer test:security
            timeout_seconds: 1800
          - id: critical-orders
            name: critical-orders
            command: composer test:orders
            timeout_seconds: 1800
          - id: critical-kitchen
            name: critical-kitchen-kds
            command: composer test:kitchen
            timeout_seconds: 1800
          - id: critical-money
            name: critical-money-cashier
            command: composer test:money
            timeout_seconds: 2400
          - id: critical-inventory
            name: critical-inventory
            command: composer test:inventory
            timeout_seconds: 1800
          - id: critical-release-contract
            name: critical-release-contract
            command: composer test:release-contract
            timeout_seconds: 2400
          - id: full-gate
            name: full-gate
            command: bash scripts/ci/booking-full-gate.sh
            timeout_seconds: 7200
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: restaurantpos_ci
          MYSQL_USER: restaurantpos
          MYSQL_PASSWORD: restaurantpos
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, pdo_mysql, redis, phar
          ini-values: memory_limit=3G
          tools: composer:v2
          coverage: none

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h 127.0.0.1 -P 3306 -uroot -proot --silent && exit 0
            sleep 2
          done
          echo "MySQL service did not become healthy in time." >&2
          exit 1

      - name: Allow CI routine creators
        run: |
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "SET GLOBAL log_bin_trust_function_creators = 1;"
          mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "SHOW VARIABLES LIKE 'log_bin_trust_function_creators';"

      - name: Wait for Redis
        run: |
          php -r '
          $host = getenv("REDIS_HOST") ?: "127.0.0.1";
          $port = (int) (getenv("REDIS_PORT") ?: 6379);
          for ($i = 0; $i < 30; $i++) {
              try {
                  $redis = new Redis();
                  if (@$redis->connect($host, $port, 1.0) && $redis->ping()) {
                      exit(0);
                  }
              } catch (Throwable) {
                  // Retry until the service container is reachable from the runner.
              }
              sleep(2);
          }
          fwrite(STDERR, "Redis service did not become ready in time.\n");
          exit(1);
          '

      - name: Validate repository prerequisites
        run: bash scripts/ci/booking-repo-prereq-check.sh

      - name: Bootstrap CI environment
        run: |
          set -o pipefail
          mkdir -p build/booking-ci
          bash scripts/ci/booking-ci-bootstrap.sh 2>&1 | tee build/booking-ci/bootstrap.log

      - name: Run ${{ matrix.lane.name }}
        env:
          BOOKING_CI_LANE_COMMAND: ${{ matrix.lane.command }}
          BOOKING_CI_LANE_ID: ${{ matrix.lane.id }}
          BOOKING_CI_LANE_NAME: ${{ matrix.lane.name }}
          BOOKING_CI_LANE_TIMEOUT_SECONDS: ${{ matrix.lane.timeout_seconds || 1800 }}
        run: bash scripts/ci/booking-ci-run-lane.sh

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-ci-evidence-${{ matrix.lane.id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/booking-ci/**
            build/booking-release/**
            storage/app/booking_release/**
            storage/logs/**

  staff-web-critical:
    name: critical-staff-web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: staff-web/package-lock.json

      - name: Install staff-web dependencies
        run: npm ci --no-audit --no-fund
        working-directory: staff-web

      - name: Run staff-web integrity check
        run: npm run integrity:check
        working-directory: staff-web

      - name: Build staff-web
        run: npm run build
        working-directory: staff-web
