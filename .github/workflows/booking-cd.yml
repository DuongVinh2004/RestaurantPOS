name: Booking CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment script on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            # Exit immediately if a command exits with a non-zero status
            set -e

            echo "🚀 Starting Deployment Process..."

            # Ensure we are in the project directory
            cd /var/www/RestaurantPOS

            echo "📦 Fetching latest code from GitHub..."
            git fetch origin main
            git reset --hard origin/main

            echo "🐳 Building and restarting Docker containers..."
            docker-compose -f docker-compose.prod.yml up -d --build

            echo "🧹 Clearing Laravel caches..."
            docker-compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear
            docker-compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker-compose -f docker-compose.prod.yml exec -T app php artisan view:cache
            
            echo "🛡️ Running Production Gates..."
            # Check deployment safety (SQL-first patches)
            docker-compose -f docker-compose.prod.yml exec -T app php artisan booking:deploy-check --strict
            
            # Bootstrap site idempotently
            docker-compose -f docker-compose.prod.yml exec -T app php artisan booking:bootstrap-site

            echo "✅ Deployment completed successfully!"
