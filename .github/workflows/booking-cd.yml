name: Booking CD Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: booking-production-deploy
  cancel-in-progress: false

jobs:
  dependency-security:
    name: Dependency Security Prerequisite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            customer-web/package-lock.json
            staff-web/package-lock.json

      - name: Audit production dependencies and verify split-web clients
        run: bash scripts/ci/booking-dependency-security-gate.sh

      - name: Upload dependency advisory and SBOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-evidence-production-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
          path: build/booking-ci/dependency-security/**

  deploy:
    name: Deploy to Production
    needs: dependency-security
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Execute deployment script on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script_stop: true
          script: |
            set -eu

            echo "Starting manual production deployment..."

            # Ensure we are in the project directory
            cd /var/www/RestaurantPOS

            echo "Fetching the approved main revision..."
            git fetch origin main
            git reset --hard origin/main

            echo "Building candidate containers without restarting production..."
            docker-compose -f docker-compose.prod.yml build

            echo "Running strict JSON preflight against the candidate image..."
            docker-compose -f docker-compose.prod.yml run --rm -T app php artisan booking:deploy-check --mode=preflight --strict --json

            echo "Restarting production services after successful preflight..."
            docker-compose -f docker-compose.prod.yml up -d

            echo "Rebuilding Laravel caches..."
            docker-compose -f docker-compose.prod.yml exec -T app php artisan optimize:clear
            docker-compose -f docker-compose.prod.yml exec -T app php artisan config:cache
            docker-compose -f docker-compose.prod.yml exec -T app php artisan view:cache

            # Bootstrap site idempotently
            docker-compose -f docker-compose.prod.yml exec -T app php artisan booking:bootstrap-site

            echo "Production deployment completed."
