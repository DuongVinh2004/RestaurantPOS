server {
    listen 80;
    server_name staff.yourdomain.com; # TODO: replace with real domain

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name staff.yourdomain.com; # TODO: replace with real domain

    ssl_certificate /etc/nginx/certs/live/staff.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/staff.yourdomain.com/privkey.pem;

    root /var/www/staff-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caching static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires max;
        log_not_found off;
        access_log off;
    }
}
